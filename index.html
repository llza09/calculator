<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soft Calculator</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ffe6f2,
                #eee5ff,
                #e3f5ff
            );

            font-family: Arial, sans-serif;
        }

        .calculator {
            position: relative;
z-index: 20;
            width: 340px;
            padding: 28px;

            border-radius: 40px;

            background: #fff7fb;

            border: 4px solid #f4c6df;

            outline: 3px solid #eadcff;
            outline-offset: 5px;

            box-shadow:
                0 20px 40px rgba(190, 150, 190, 0.25),
                inset 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .display {
            height: 90px;
            margin-bottom: 25px;
            padding: 20px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            border-radius: 30px;

            background: linear-gradient(
                135deg,
                #fffafd,
                #fff0f7
            );

            border: 3px solid #f7d8e8;

            color: #76556c;

            font-size: 32px;
            font-weight: bold;

            box-shadow:
                inset 0 3px 10px rgba(190, 150, 190, 0.12),
                0 4px 8px rgba(190, 150, 190, 0.12);

            overflow: hidden;
        }

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 14px;
        }

        button {
            height: 62px;

            border: none;
            border-radius: 50%;

            background: #ffddeb;
            color: #76556c;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 10px rgba(190, 140, 175, 0.2),
                inset 0 3px 5px rgba(255, 255, 255, 0.8);

            transition: 0.15s ease;
        }

       button:hover {
    transform: translateY(-4px);
    filter: brightness(1.04);
}

button:active {
    transform: scale(0.88);
    box-shadow:
        0 2px 5px rgba(190, 140, 175, 0.2),
        inset 0 3px 6px rgba(190, 140, 175, 0.15);
}

        button:nth-child(4n) {
            background: #dcd0ff;
            color: #66527f;
        }

        button:nth-child(2),
        button:nth-child(3) {
            background: #dff4ff;
        }

        button:nth-child(1) {
            background: #f6d5ff;
        }

        button:last-child {
            grid-column: span 2;

            border-radius: 35px;

            background: #f3b9d4;
            color: white;
        }
.floating-hearts {
    position: fixed;
    inset: 0;

    pointer-events: none;
    overflow: hidden;

    z-index: 10;
}

.floating-hearts span {
    position: absolute;

    font-size: 24px;

    opacity: 0.65;

    animation: floatHeart 5s ease-in-out infinite;
}

.floating-hearts span:nth-child(1) {
    left: 10%;
    top: 20%;
}

.floating-hearts span:nth-child(2) {
    left: 85%;
    top: 15%;
    animation-delay: 1s;
}

.floating-hearts span:nth-child(3) {
    left: 15%;
    top: 75%;
    animation-delay: 2s;
}

.floating-hearts span:nth-child(4) {
    left: 88%;
    top: 70%;
    animation-delay: 3s;
}

.floating-hearts span:nth-child(5) {
    left: 25%;
    top: 10%;
    animation-delay: 1.5s;
}

.floating-hearts span:nth-child(6) {
    left: 75%;
    top: 85%;
    animation-delay: 2.5s;
}

@keyframes floatHeart {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}
        .heart {
            width: 62px;
            height: 62px;

            background: #f3b9d4;
            color: white;

            border-radius: 0;

            box-shadow:
                0 6px 10px rgba(190, 140, 175, 0.2),
                inset 0 3px 5px rgba(255, 255, 255, 0.8);

            filter: drop-shadow(
                0 5px 5px rgba(190, 140, 175, 0.25)
            );

            clip-path: polygon(
                50% 92%,
                12% 55%,
                5% 40%,
                5% 25%,
                12% 12%,
                25% 7%,
                38% 10%,
                50% 25%,
                62% 10%,
                75% 7%,
                88% 12%,
                95% 25%,
                95% 40%,
                88% 55%
            );
        }

    </style>
</head>

<body>

    <div class="floating-hearts">
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
    </div>

    <div class="calculator">

        <div class="display">
            0
        </div>

        <div class="buttons">

            <button class="heart">♥</button>
            <button>⌫</button>
            <button>%</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>0</button>
            <button>.</button>
            <button>=</button>

        </div>

    </div>

    <script>

        const display = document.querySelector(".display");
        const buttons = document.querySelectorAll("button");

        let currentInput = "";
        let previousInput = "";
        let operator = "";

        buttons.forEach(button => {

            button.addEventListener("click", () => {

                const value = button.textContent;

                // Clear
                if (value === "♥") {
                    currentInput = "";
                    previousInput = "";
                    operator = "";

                    display.textContent = "0";

                    return;
                }

                // Delete
                if (value === "⌫") {
                    currentInput = currentInput.slice(0, -1);

                    display.textContent = currentInput || "0";

                    return;
                }

                // Numbers and decimal
                if (!isNaN(value) || value === ".") {

                    currentInput += value;

                    display.textContent = currentInput;

                    return;
                }

                // Percentage
                if (value === "%") {

                    currentInput = String(
                        Number(currentInput) / 100
                    );

                    display.textContent = currentInput;

                    return;
                }

                // Operators
                if (["+", "−", "×", "÷"].includes(value)) {

                    previousInput = currentInput;

                    currentInput = "";

                    operator = value;

                    return;
                }

                // Equals
                if (value === "=") {

                    if (
                        previousInput === "" ||
                        currentInput === ""
                    ) {
                        return;
                    }

                    const firstNumber = Number(previousInput);
                    const secondNumber = Number(currentInput);

                    let result;

                    if (operator === "+") {
                        result = firstNumber + secondNumber;
                    }

                    if (operator === "−") {
                        result = firstNumber - secondNumber;
                    }

                    if (operator === "×") {
                        result = firstNumber * secondNumber;
                    }

                    if (operator === "÷") {
                        result =
                            secondNumber === 0
                            ? "Error"
                            : firstNumber / secondNumber;
                    }

                    display.textContent = result;

                    currentInput = String(result);
                    previousInput = "";
                    operator = "";
                }

            });

        });

    </script>

</body>
</html>
