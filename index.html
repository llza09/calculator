<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Calculator</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
            135deg,
            #ffe6f2,
            #eee5ff,
            #e3f5ff
        );
        font-family: Arial, sans-serif;
    }

    .calculator {
        width: 340px;
        padding: 28px;
        border-radius: 40px;
        background: #fff7fb;
        border: 4px solid #f4c6df;
        outline: 3px solid #eadcff;
        outline-offset: 5px;
        box-shadow:
            0 20px 40px rgba(190, 150, 190, 0.25),
            inset 0 0 20px rgba(255, 255, 255, 0.8);
        border: 3px solid #f8d8e8;
    }

    .display {
    height: 90px;
    margin-bottom: 25px;
    padding: 20px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    border-radius: 30px;
    background: linear-gradient(
        135deg,
        #fffafd,
        #fff0f7
    );

    border: 3px solid #f7d8e8;

    color: #76556c;
    font-size: 32px;
    font-weight: bold;

    box-shadow:
        inset 0 3px 10px rgba(190, 150, 190, 0.12),
        0 4px 8px rgba(190, 150, 190, 0.12);

    overflow: hidden;
}

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
    }

    button {
    height: 62px;
    border: none;
    border-radius: 50%;

    background: #ffddeb;
    color: #76556c;

    font-size: 19px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 6px 10px rgba(190, 140, 175, 0.2),
        inset 0 3px 5px rgba(255, 255, 255, 0.8);

    transition: 0.15s ease;
}

    button:hover {
        transform: translateY(-3px);
    }

    button:active {
        transform: scale(0.92);
    }

    button:nth-child(4n) {
        background: #dcd0ff;
        color: #66527f;
    }

    button:nth-child(2),
    button:nth-child(3) {
        background: #dff4ff;
    }

    button:nth-child(1) {
        background: #f6d5ff;
    }

    button:last-child {
        grid-column: span 2;
        border-radius: 35px;
        background: #f3b9d4;
        color: white;
    }
    .heart {
        width: 62px;
        height: 62px;
        background: #f3b9d4;
        color: white;
        border-radius: 0;

    box-shadow:
        0 6px 10px rgba(190, 140, 175, 0.2),
        inset 0 3px 5px rgba(255, 255, 255, 0.8);

    filter: drop-shadow(
        0 5px 5px rgba(190, 140, 175, 0.25)
    );

    clip-path: polygon(
        50% 92%,
        12% 55%,
        5% 40%,
        5% 25%,
        12% 12%,
        25% 7%,
        38% 10%,
        50% 25%,
        62% 10%,
        75% 7%,
        88% 12%,
        95% 25%,
        95% 40%,
        88% 55%
    );
}
</style>
</head>

<body>

    <div class="calculator">

        <div class="display">
            0
        </div>

        <div class="buttons">
            <button class="heart">♥</button>
            <button>⌫</button>
            <button>%</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>

    </div>
    <script>

</script>
</body>
</html>
